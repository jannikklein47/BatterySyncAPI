name: Docker CI/CD Pipeline

on:
  push:
    branches: ["add-cicd"]

jobs:
  test:
    runs-on: ubuntu-latest

    # Define background services for this job
    services:
      postgres:
        image: postgres:16 # Match this to your production version
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: BatterySyncTest # Default maintenance DB
        ports:
          - 5432:5432
        # Ensure GitHub waits for Postgres to be completely ready before starting steps
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Run Tests
        run: |
          npm ci
          npm test
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required to push to GHCR

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # TODO: Ensure this string is entirely LOWERCASE
          tags: ghcr.io/jannikklein47/batterysyncapi:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/deployment-api

            sudo docker compose pull

            sudo docker compose down
            sudo docker compose up -d
