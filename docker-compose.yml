services:
  db:
    image: postgres:15-alpine
    container_name: batterysync-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: BatterySync
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  api:
    build: .
    container_name: batterysync-server
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro

    depends_on:
      - db
    environment:
      - DB_HOST=db 
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=BatterySync
      - DB_PORT=5432
      - NODE_ENV=production
volumes:
  postgres_data:
